# Nodo UCR - Escuela de Geografía (workspace eg)
# Configuración declarativa validable contra config/esquema-nodo.json.
# Capas institucionales publicadas fuera de los subnodos MOCUPP. Registradas en
# el SNIT bajo el nodo "UCR - Escuela de Geografía" (ambas sin metadatos cargados
# en el SNIT al 2026-08-11). Fuentes: GeoServer vivo (REST, 2026-08-11) e insumos
# consolidados en ~/geografia-ucr/datos-fuente/icr-indice-combinado-ruralidad/.

nodo:
  slug: eg
  titulo: UCR - Escuela de Geografía
  workspace: eg
  datastore: eg
  datastore_tipo: shapefile_dir
  responsable: Escuela de Geografía, Universidad de Costa Rica (EG-UCR)

defaults:
  crs_destino: EPSG:8908
  formato: shapefile
  destinos:
    snit: true
    geonode: false

capas:
  - slug: ICR_dist2011
    titulo: Índice Combinado de Ruralidad
    abstract: >-
      Índice Combinado de Ruralidad (ICR) por distrito de Costa Rica (491
      distritos), elaborado por la Comisión Económica para América Latina y el
      Caribe (CEPAL) para proponer un concepto de ruralidad no dicotómica a
      partir de datos geoestadísticos multidimensionales oficiales. El índice
      se calcula con datos del censo 2011; los 22 distritos creados después
      del censo y la Isla del Coco quedan con valor 0 (sin dato).
    palabras_clave: [Ruralidad, ICR, Distritos, CEPAL, Costa Rica, "2011"]
    anio: 2011
    extension: nacional
    habilitada: true
    # El featureType se publicó con el nombre ICR_dist2011 sobre el archivo
    # nativo ICR_distritos_CEPAL_vf_CRSIRGAS.shp del datastore.
    archivo: ICR_distritos_CEPAL_vf_CRSIRGAS.shp
    sha256: 0a7852d318b42978b799dd29f91ed667ecdf406341b7c6fc3b2d71e7f995d858
    fuente:
      archivo_original: ICR_distritos_CEPAL_vf.shp
      ubicacion: ~/geografia-ucr/datos-fuente/icr-indice-combinado-ruralidad/original-cr05-cepal/
      crs_origen: EPSG:5367
      sha256: 6d327e7fc5a67887403185998185a3dc06abd5ee7ab8a8b427d221b729d9c028
    transformaciones:
      - tipo: ogr2ogr
        descripcion: >-
          Reproyección CR05/CRTM05 (EPSG:5367) a CR-SIRGAS/CRTM05 (EPSG:8908),
          previa a este repositorio (verificada el 2026-08-11: la capa publicada
          es idéntica al shapefile transformado, 491 features y mismos
          atributos). El comando exacto no consta.
        fecha: null
    metadatos:
      # Metadato ISO 19115-3 (perfil NTIG_CR04) de CEPAL adaptado a las
      # convenciones del SNIT y cargado a su herramienta el 2026-08-11
      # (registro vivo: ver enlace en notas; copia genuina en
      # metadatos/eg/2-revision-snit/ICR_dist2011-enviado.xml).
      estado: enviado
      identificador_snit: CR_EG-UCR_ICR_2011_5K_VE
    publicado:
      geoserver: "2025-05-13"  # TODO: fecha del datastore eg (REST dateCreated); la de la capa no consta
      snit: null
      geonode: null
    notas: >-
      Esta capa es además el contorno nacional usado por geopub vista-previa
      (config/global.yml, snit.capa_limites). Verificación 2026-08-11: WFS
      publicado == datos-fuente (hash por feature de atributos, 2 329 526
      vértices, 51 170 km²). ICR_2011 = 0 significa sin dato (22 distritos
      creados después del censo 2011 e Isla del Coco). Registro en el SNIT
      (enviado 2026-08-11):
      https://www.snitcr.go.cr/Tramites/ver_xml_publico?key=dHJhbWl0ZV9zbml0OjoyMzQ3NDE2ODU2YTdiNWI0ZjIxMWY3OTA1OTM3MzAzNg==
      — al subirlo, la herramienta reasignó la organización del autor del
      metadato a CEPAL (EG-UCR no figura) e inyectó teléfonos placeholder y el
      correo personal como correo de la organización; revisar en el editor.

  - slug: AcantiladosMuertosSirgas
    titulo: Acantilados muertos
    habilitada: true
    archivo: AcantiladosMuertosSirgas.shp
    sha256: null  # sin datos locales: el shapefile solo existe en el servidor
    publicado:
      geoserver: "2025-05-13"  # TODO: fecha del datastore eg; la de la capa no consta
      snit: null
      geonode: null
    notas: >-
      Sin datos locales ni metadatos (2026-08-11): no hay XML en ninguna parte y
      el registro autogenerado de GeoNode está vacío. El identificador
      CR_EG-UCR_ACANTILADOSMUERTOS_500KVE (escala 1:500.000) citado en
      docs/pendientes.md proviene del export viejo de GeoNetwork y no se
      encontró en archivos locales. Zona de Osa, Puntarenas. Si se retoma:
      descargar el shapefile del servidor, generar metadatos y empaquetar con
      geopub release crear.
